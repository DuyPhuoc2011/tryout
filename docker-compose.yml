services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tryout
      POSTGRES_PASSWORD: tryout
      POSTGRES_DB: tryout
    ports:
      - "5432:5432"
    volumes:
      - tryout_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tryout"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tryout_pg:
